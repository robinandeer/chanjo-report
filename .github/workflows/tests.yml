name: Tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out git repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Check lint and formatting
              run: |
                  uv sync --locked --only-group dev
                  uv run ruff check .
                  uv run ruff format --check .

    test:
        name: Run tests in containers
        runs-on: ubuntu-latest
        steps:
            - name: Check out git repository
              uses: actions/checkout@v7

            # Runs the same containerised suite as `make test` locally: MariaDB
            # plus the test image, which installs only the locked dependencies
            - name: Run tests
              run: make test
